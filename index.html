<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>桌宠 · 邱禧悦 & 何芬</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body { height:100%; overflow:hidden; font-family:-apple-system,"PingFang SC",sans-serif; }
  body { user-select:none; }

  /* ===== 背景层 ===== */
  #bgLayer {
    position:fixed; inset:0; z-index:0;
    transition: background 0.8s ease;
    background: linear-gradient(160deg,#ffeef2,#e8f4f8 55%,#f3e8ff);
  }
  #bgLayer.dorm    { background: linear-gradient(160deg,#ffe8d6,#ffd6b0 50%,#ffc9a0); }
  #bgLayer.class   { background: linear-gradient(160deg,#d6ecff,#c0dcff 50%,#a8ccff); }
  #bgLayer.cafe    { background: linear-gradient(160deg,#f0e0d0,#e0c8b0 50%,#d0b090); }
  #bgLayer.park    { background: linear-gradient(160deg,#d6f0d6,#b8e8c0 50%,#a0d8a8); }
  #bgLayer.night   { background: linear-gradient(160deg,#2a2a4a,#3a3a5a 50%,#1a1a3a); }

  /* 背景装饰 */
  #bgDecor { position:fixed; inset:0; z-index:0; pointer-events:none; overflow:hidden; }
  #bgDecor .deco { position:absolute; opacity:0.85; }
  #bgDecor .bed { bottom:0; left:0; width:100%; height:22vh; background:linear-gradient(180deg,transparent,#c9a8d8); opacity:0.4; }
  #bgDecor .window { top:8%; left:8%; width:28%; height:22%; background:linear-gradient(180deg,#b8d8ff,#e8f4ff); border-radius:8px; box-shadow:0 0 0 4px #fff; }
  #bgDecor .desk { bottom:0; right:0; width:40%; height:18vh; background:linear-gradient(180deg,#c8a880,#a88860); border-radius:8px 0 0 0; opacity:0.5; }
  #bgDecor .board { top:8%; left:10%; width:80%; height:26%; background:#3a5a3a; border-radius:6px; box-shadow:0 0 0 5px #a88860; }
  #bgDecor .tree { bottom:0; left:5%; width:20%; height:40%; background:radial-gradient(ellipse at 50% 100%,#5a8a4a,#3a6a3a); border-radius:50% 50% 0 0; opacity:0.6; }
  #bgDecor .table { bottom:0; left:50%; transform:translateX(-50%); width:60%; height:14vh; background:linear-gradient(180deg,#a87850,#8a5830); border-radius:8px 8px 0 0; opacity:0.5; }
  #bgDecor .moon { top:8%; right:12%; width:60px; height:60px; border-radius:50%; background:radial-gradient(circle,#fff8d0,#ffe066); box-shadow:0 0 30px #ffe066; }
  #bgDecor .stars { top:0; left:0; width:100%; height:60%; background-image:radial-gradient(2px 2px at 20% 30%,#fff,transparent),radial-gradient(2px 2px at 60% 20%,#fff,transparent),radial-gradient(1px 1px at 80% 50%,#fff,transparent),radial-gradient(2px 2px at 40% 60%,#fff,transparent),radial-gradient(1px 1px at 90% 30%,#fff,transparent); opacity:0.6; }

  /* ===== 选择页 ===== */
  #selectPage {
    position:fixed; inset:0; z-index:500;
    background:linear-gradient(160deg,#ffeef2,#e8f4f8 55%,#f3e8ff);
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    gap:14px; padding:20px; overflow-y:auto;
  }
  #selectPage.hide { display:none; }
  #selectPage h1 { font-size:20px; color:#e0629a; margin-bottom:4px; }
  #selectPage p { font-size:12px; color:#889; margin-bottom:8px; }
  .charCard {
    width:80vw; max-width:340px;
    background:#fff; border-radius:22px; padding:16px;
    box-shadow:0 10px 30px rgba(0,0,0,.12);
    display:flex; align-items:center; gap:16px;
    cursor:pointer; transition:transform .15s;
    border:3px solid transparent;
  }
  .charCard:active { transform:scale(.97); }
  .charCard.both { border-color:#ffd6e0; background:linear-gradient(135deg,#fff,#fff5f8); }
  .charCard .avatar { width:64px; height:64px; border-radius:50%; display:flex; align-items:center; justify-content:center; font-size:32px; flex-shrink:0; }
  .charCard .name { font-size:18px; font-weight:700; color:#456; }

  /* ===== 状态栏 ===== */
  #stats {
    position:fixed; top:0; left:0; right:0; z-index:10;
    padding:6px; display:flex; gap:5px; justify-content:center; align-items:center;
    background:rgba(255,255,255,.68); backdrop-filter:blur(10px);
    font-size:10px; color:#345; flex-wrap:wrap;
  }
  .bar { width:48px; }
  .bar-label { font-size:8px; margin-bottom:1px; white-space:nowrap; }
  .bar-bg { height:5px; background:rgba(0,0,0,.1); border-radius:4px; overflow:hidden; }
  .bar-fill { height:100%; border-radius:4px; transition:width .4s; }
  #moodFill { background:linear-gradient(90deg,#ff9a9e,#fad0c4); }
  #foodFill { background:linear-gradient(90deg,#84fab0,#8fd3f4); }
  #loveFill { background:linear-gradient(90deg,#ff7eb3,#ff9a5a); }
  #angryFill { background:linear-gradient(90deg,#ff6b6b,#ff9f43); }
  #sadFill { background:linear-gradient(90deg,#7fa8d8,#a8c8f0); }
  #loveLv { font-size:8px; color:#e0629a; font-weight:700; }

  /* ===== 舞台 ===== */
  #stage {
    position:fixed; left:0; right:0; bottom:24vh; z-index:5;
    display:flex; gap:2vw; align-items:flex-end; justify-content:center;
    width:100%;
  }
  .petSlot {
    position:relative;
    animation: idle 2.6s ease-in-out infinite;
    transition: transform .15s, opacity .6s;
    cursor:pointer;
    filter: drop-shadow(0 12px 20px rgba(0,0,0,.2));
    touch-action: manipulation;
  }
  .petSlot.single { width:62vmin; max-width:340px; height:62vmin; max-height:340px; }
  .petSlot.duo    { width:38vmin; max-width:220px; height:38vmin; max-height:220px; }
  .petSlot:active { transform:scale(.94); }
  .petSlot.away { opacity:0; transform:translateX(120px) scale(.7); pointer-events:none; }
  .petSlot.talking { animation: talk 0.5s ease-in-out infinite; }
  @keyframes talk { 0%,100% { transform:translateY(0); } 50% { transform:translateY(-6px); } }
  @keyframes idle { 0%,100% { transform:translateY(0) rotate(0deg); } 50% { transform:translateY(-10px) rotate(-1.5deg); } }
  @keyframes happy { 0%,100% { transform:translateY(0) scale(1); } 30% { transform:translateY(-28px) scale(1.12); } 60% { transform:translateY(0) scale(.94); } }
  .happy { animation: happy .6s ease; }
  @keyframes shake { 0%,100% { transform:translateX(0); } 20% { transform:translateX(-8px) rotate(-2deg); } 40% { transform:translateX(8px) rotate(2deg); } 60% { transform:translateX(-6px); } 80% { transform:translateX(6px); } }
  .shake { animation: shake .45s ease; }
  @keyframes lean { 0%,100% { transform:translateY(0) rotate(0deg); } 50% { transform:translateY(-14px) rotate(3deg) scale(1.04); } }
  .lean { animation: lean 1.2s ease-in-out infinite; }
  .petSlot svg { width:100%; height:100%; display:block; }

  /* ===== 气泡 ===== */
  .bubble {
    position:fixed; background:#fff; padding:8px 13px; border-radius:14px;
    font-size:13px; color:#345; max-width:70vw; text-align:center;
    box-shadow:0 4px 14px rgba(0,0,0,.13);
    opacity:0; transition:opacity .3s, transform .3s;
    transform:translateY(6px); pointer-events:none; z-index:20;
  }
  .bubble.show { opacity:1; transform:translateY(0); }
  .bubble::after { content:''; position:absolute; bottom:-7px; left:50%; transform:translateX(-50%); border:7px solid transparent; border-top-color:#fff; border-bottom:0; }
  .bubble.qiu { border-top:3px solid #ff8fb1; }
  .bubble.he  { border-top:3px solid #8fb1ff; }

  /* ===== 选项 / 面板 ===== */
  #choices {
    position:fixed; bottom:26vh; left:0; right:0;
    display:flex; flex-direction:column; gap:6px; align-items:center;
    padding:0 16px; z-index:11;
    opacity:0; transform:translateY(10px); pointer-events:none;
    transition:opacity .25s, transform .25s;
  }
  #choices.show { opacity:1; transform:translateY(0); pointer-events:auto; }
  #choices button {
    width:100%; max-width:340px; padding:10px 15px;
    border:none; border-radius:13px; font-size:13px; text-align:left;
    background:rgba(255,255,255,.96); color:#456;
    box-shadow:0 3px 12px rgba(0,0,0,.1);
    cursor:pointer; transition:transform .1s;
  }
  #choices button:active { transform:scale(.97); background:#fff0f5; }
  #choices button .emo { margin-right:7px; }

  #panel {
    position:fixed; bottom:20vh; left:50%; transform:translate(-50%,10px);
    background:rgba(255,255,255,.97); border-radius:20px;
    padding:12px; z-index:30;
    box-shadow:0 10px 34px rgba(0,0,0,.18);
    display:none; width:92vw; max-width:400px;
    max-height:54vh; overflow-y:auto;
  }
  #panel.show { display:block; animation:pop .25s ease; }
  @keyframes pop { from { opacity:0; transform:translate(-50%,20px) scale(.95); } }
  #panel h3 { font-size:13px; color:#e0629a; margin-bottom:9px; text-align:center; }
  #panel .grid { display:flex; gap:7px; justify-content:center; flex-wrap:wrap; }
  #panel .item {
    width:58px; height:58px; border-radius:15px;
    background:#fff5f8; border:2px solid transparent;
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    font-size:22px; cursor:pointer; transition:transform .1s;
  }
  #panel .item:active { transform:scale(.9); }
  #panel .item.active { border-color:#ff9ec4; background:#ffeef5; }
  #panel .item span { font-size:8px; color:#888; margin-top:1px; }

  /* ===== 底部按钮 ===== */
  #actions {
    position:fixed; bottom:0; left:0; right:0; z-index:10;
    padding:8px 4px calc(8px + env(safe-area-inset-bottom));
    display:flex; gap:3px; justify-content:center; flex-wrap:wrap;
    background:rgba(255,255,255,.7); backdrop-filter:blur(10px);
  }
  #actions button {
    flex:1; min-width:0; max-width:56px; padding:7px 0;
    border:none; border-radius:12px; font-size:9px; font-weight:600;
    background:#fff; color:#456; box-shadow:0 2px 8px rgba(0,0,0,.1);
    cursor:pointer; line-height:1.25;
  }
  #actions button:active { transform:scale(.93); background:#fff0f5; }
  #actions button .ico { display:block; font-size:14px; margin-bottom:1px; }
  #actions button.apologize { background:linear-gradient(135deg,#ffd6e0,#ffc0d4); color:#c04a7a; }
  #actions button.switchMode { background:linear-gradient(135deg,#e0f0ff,#d0e8ff); color:#4a7ac0; }

  .float { position:fixed; font-size:22px; pointer-events:none; z-index:99; animation: floatUp 1s ease-out forwards; }
  @keyframes floatUp { 0% { opacity:1; transform:translateY(0) scale(1); } 100% { opacity:0; transform:translateY(-80px) scale(1.3); } }

  .itemFly {
    position:fixed; font-size:34px; pointer-events:none; z-index:120;
    transition: all 0.9s cubic-bezier(0.34, 1.56, 0.64, 1);
    opacity:0;
  }
  .itemFly.show { opacity:1; }

  /* 扔东西（生气） */
  .throwItem {
    position:fixed; font-size:32px; pointer-events:none; z-index:119;
    animation: throwFly 1s ease-out forwards;
  }
  @keyframes throwFly {
    0%   { opacity:1; transform:translate(0,0) rotate(0deg) scale(1); }
    100% { opacity:0; transform:translate(80px,-60px) rotate(360deg) scale(.6); }
  }

  .heart { position:fixed; font-size:18px; pointer-events:none; z-index:98; animation: heartFall 1.6s ease-out forwards; }
  @keyframes heartFall { 0% { opacity:1; transform:translateY(0) rotate(0deg); } 100% { opacity:0; transform:translateY(120px) rotate(40deg); } }

  #toast {
    position:fixed; top:46%; left:50%; transform:translate(-50%,-50%) scale(.7);
    color:#fff; padding:12px 22px; border-radius:18px;
    font-size:15px; font-weight:700; z-index:200;
    opacity:0; pointer-events:none; transition:all .4s;
    white-space:nowrap; max-width:80vw; text-align:center;
  }
  #toast.show { opacity:1; transform:translate(-50%,-50%) scale(1); }
  #toast.love  { background:linear-gradient(135deg,#ffb3c8,#ff8fb1); box-shadow:0 10px 30px rgba(255,143,177,.5); }
  #toast.angry { background:linear-gradient(135deg,#ff6b6b,#ff9f43); box-shadow:0 10px 30px rgba(255,107,107,.5); }
  #toast.calm  { background:linear-gradient(135deg,#8fd3f4,#84fab0); box-shadow:0 10px 30px rgba(143,211,244,.5); }
  #toast.sad   { background:linear-gradient(135deg,#7fa8d8,#a8c8f0); box-shadow:0 10px 30px rgba(127,168,216,.5); }
  #toast.gift  { background:linear-gradient(135deg,#ffd166,#ff9ec4); box-shadow:0 10px 30px rgba(255,209,102,.5); }

  #giftBag {
    position:fixed; top:40px; right:6px; z-index:15;
    background:rgba(255,255,255,.85); backdrop-filter:blur(8px);
    border-radius:13px; padding:5px 9px; font-size:11px; color:#e0629a;
    box-shadow:0 2px 10px rgba(0,0,0,.1); font-weight:700; cursor:pointer;
  }
  #switchChar {
    position:fixed; top:40px; left:6px; z-index:15;
    background:rgba(255,255,255,.85); backdrop-filter:blur(8px);
    border-radius:13px; padding:5px 9px; font-size:11px; color:#7a6;
    box-shadow:0 2px 10px rgba(0,0,0,.1); font-weight:700;
    cursor:pointer; border:none;
  }
</style>
</head>
<body>

<div id="bgLayer" class="dorm"></div>
<div id="bgDecor"></div>

<div id="selectPage">
  <h1>选一个桌宠</h1>
  <p>她们是认识3年的舍友</p>
  <div class="charCard" onclick="chooseMode('qiu')">
    <div class="avatar" style="background:#ffe0e6">😠</div>
    <div class="name">邱禧悦</div>
  </div>
  <div class="charCard" onclick="chooseMode('he')">
    <div class="avatar" style="background:#e8f0ff">🙂</div>
    <div class="name">何芬</div>
  </div>
  <div class="charCard both" onclick="chooseMode('both')">
    <div class="avatar" style="background:linear-gradient(135deg,#ffe0e6,#e8f0ff)">👭</div>
    <div class="name">两人同屏</div>
  </div>
</div>

<button id="switchChar" onclick="showSelect()">🔄 换人</button>
<div id="giftBag" onclick="openBag()">🎒 <span id="bagCount">0</span></div>

<div id="stats">
  <div class="bar"><div class="bar-label">😊 心情</div><div class="bar-bg"><div class="bar-fill" id="moodFill" style="width:55%"></div></div></div>
  <div class="bar"><div class="bar-label">🍚 饱食</div><div class="bar-bg"><div class="bar-fill" id="foodFill" style="width:80%"></div></div></div>
  <div class="bar"><div class="bar-label">💧 伤心</div><div class="bar-bg"><div class="bar-fill" id="sadFill" style="width:0%"></div></div></div>
  <div class="bar"><div class="bar-label">😠 怒气</div><div class="bar-bg"><div class="bar-fill" id="angryFill" style="width:0%"></div></div></div>
  <div class="bar"><div class="bar-label">💗 <span id="loveLv">Lv.1</span></div><div class="bar-bg"><div class="bar-fill" id="loveFill" style="width:0%"></div></div></div>
</div>

<div id="stage">
  <div class="petSlot single" id="slotQiu" style="display:none"></div>
  <div class="petSlot single" id="slotHe"  style="display:none"></div>
</div>

<div id="choices"></div>

<div id="panel">
  <h3 id="panelTitle">道具</h3>
  <div class="grid" id="panelGrid"></div>
</div>

<div id="actions">
  <button onclick="openItems()"><span class="ico">🎁</span>礼物</button>
  <button onclick="openClothes()"><span class="ico">👗</span>衣服</button>
  <button onclick="openHeadwear()"><span class="ico">🎀</span>头饰</button>
  <button onclick="openHair()"><span class="ico">💇</span>发型</button>
  <button onclick="openGlasses()"><span class="ico">👓</span>眼镜</button>
  <button onclick="openScene()"><span class="ico">🏠</span>场景</button>
  <button onclick="chat()"><span class="ico">💬</span>聊天</button>
  <button onclick="openMean()"><span class="ico">😈</span>欺负</button>
  <button id="apologyBtn" onclick="apologize()"><span class="ico">🙇</span>道歉</button>
  <button class="switchMode" onclick="showSelect()"><span class="ico">👭</span>换人</button>
</div>

<div id="toast"></div>

<script>
/* ============================================================
   角色（认识3年的舍友）
   ============================================================ */
const CHARS = {
  qiu: {
    name: '邱禧悦', avatarBg: '#ffe0e6',
    baseColor: '#ffd6e0', bodyColor: '#fbe3d3', neckColor: '#f7d9c4', faceColor: '#fbe3d3',
    defaultHair: 'long',
    backHair: `<path d="M40 90 Q36 24 100 18 Q164 24 160 90 L162 172 Q150 184 140 172 L138 98 Q120 82 100 82 Q80 82 62 98 L60 172 Q50 184 38 172 Z" fill="#241f20"/>`,
    eyesStyle: {
      normal: `<ellipse cx="80" cy="92" rx="9" ry="10" fill="#fff"/><ellipse cx="120" cy="92" rx="9" ry="10" fill="#fff"/><circle cx="80" cy="92" r="6.5" fill="#5a3b3b"/><circle cx="120" cy="92" r="6.5" fill="#5a3b3b"/><circle cx="82" cy="89" r="2.2" fill="#fff"/><circle cx="122" cy="89" r="2.2" fill="#fff"/><path d="M70 83 Q80 79 90 85" stroke="#241f20" stroke-width="3.2" fill="none" stroke-linecap="round"/><path d="M110 85 Q120 79 130 83" stroke="#241f20" stroke-width="3.2" fill="none" stroke-linecap="round"/>`,
      happy: `<path d="M70 95 Q80 83 90 95" stroke="#241f20" stroke-width="3.5" fill="none" stroke-linecap="round"/><path d="M110 95 Q120 83 130 95" stroke="#241f20" stroke-width="3.5" fill="none" stroke-linecap="round"/><path d="M70 83 Q80 79 90 85" stroke="#241f20" stroke-width="3" fill="none" stroke-linecap="round"/><path d="M110 85 Q120 79 130 83" stroke="#241f20" stroke-width="3" fill="none" stroke-linecap="round"/>`,
      shy: `<ellipse cx="80" cy="92" rx="9" ry="10" fill="#fff"/><ellipse cx="120" cy="92" rx="9" ry="10" fill="#fff"/><circle cx="80" cy="93" r="6.5" fill="#5a3b3b"/><circle cx="120" cy="93" r="6.5" fill="#5a3b3b"/><circle cx="82" cy="90" r="2.2" fill="#fff"/><circle cx="122" cy="90" r="2.2" fill="#fff"/><path d="M70 82 Q80 78 90 82" stroke="#241f20" stroke-width="3" fill="none" stroke-linecap="round"/><path d="M110 82 Q120 78 130 82" stroke="#241f20" stroke-width="3" fill="none" stroke-linecap="round"/>`,
      sad: `<ellipse cx="80" cy="94" rx="9" ry="9" fill="#fff"/><ellipse cx="120" cy="94" rx="9" ry="9" fill="#fff"/><circle cx="80" cy="95" r="6" fill="#5a3b3b"/><circle cx="120" cy="95" r="6" fill="#5a3b3b"/><path d="M70 82 Q80 86 90 82" stroke="#241f20" stroke-width="3" fill="none" stroke-linecap="round"/><path d="M110 82 Q120 86 130 82" stroke="#241f20" stroke-width="3" fill="none" stroke-linecap="round"/>`,
      cry: `<ellipse cx="80" cy="94" rx="9" ry="9" fill="#fff"/><ellipse cx="120" cy="94" rx="9" ry="9" fill="#fff"/><circle cx="80" cy="96" r="5.5" fill="#5a3b3b"/><circle cx="120" cy="96" r="5.5" fill="#5a3b3b"/><path d="M70 80 Q80 86 90 80" stroke="#241f20" stroke-width="3" fill="none" stroke-linecap="round"/><path d="M110 80 Q120 86 130 80" stroke="#241f20" stroke-width="3" fill="none" stroke-linecap="round"/>`,
      angry: `<ellipse cx="80" cy="92" rx="9" ry="10" fill="#fff"/><ellipse cx="120" cy="92" rx="9" ry="10" fill="#fff"/><circle cx="80" cy="93" r="6.5" fill="#5a3b3b"/><circle cx="120" cy="93" r="6.5" fill="#5a3b3b"/><path d="M70 79 L90 88" stroke="#241f20" stroke-width="3.8" stroke-linecap="round"/><path d="M130 79 L110 88" stroke="#241f20" stroke-width="3.8" stroke-linecap="round"/>`,
      sleep: `<path d="M70 95 Q80 101 90 95" stroke="#241f20" stroke-width="3.5" fill="none" stroke-linecap="round"/><path d="M110 95 Q120 101 130 95" stroke="#241f20" stroke-width="3.5" fill="none" stroke-linecap="round"/>`,

/* ================= SVG ================= */
function buildSVG() {
  return `<svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
    <ellipse class="baseShadow" cx="100" cy="182" rx="62" ry="10" fill="rgba(0,0,0,.1)" opacity="0.5"/>
    <path class="base" d="M38 182 Q38 120 100 120 Q162 120 162 182 Z" />
    <rect class="neck" x="88" y="108" width="24" height="26" rx="9"/>
    <ellipse class="bodyTop" cx="100" cy="142" rx="42" ry="26"/>
    <g class="clothes"></g>
    <ellipse class="face" cx="100" cy="82" rx="48" ry="52"/>
    <ellipse class="blushL" cx="66" cy="96" rx="10" ry="5" fill="#ffb3b3" opacity=".55"/>
    <ellipse class="blushR" cx="134" cy="96" rx="10" ry="5" fill="#ffb3b3" opacity=".55"/>
    <g class="backHair"></g>
    <g class="frontHair"></g>
    <g class="headwear"></g>
    <g class="eyes"></g>
    <g class="tears" style="opacity:0">
      <ellipse cx="72" cy="106" rx="3" ry="5" fill="#8ec9f0"/>
      <ellipse cx="128" cy="106" rx="3" ry="5" fill="#8ec9f0"/>
    </g>
    <path class="mouth" d="M94 112 Q100 115 106 112" stroke="#c9736f" stroke-width="2.2" fill="none" stroke-linecap="round"/>
    <g class="glasses"></g>
    <g class="prop"></g>
  </svg>`;
}

function renderChar(slot, key) {
  slot.innerHTML = buildSVG();
  applyCharToSlot(slot, key);
}
function applyCharToSlot(slot, key) {
  const c = CHARS[key];
  const s = getState(key);
  slot.querySelector('.base').setAttribute('fill', c.baseColor);
  slot.querySelector('.baseShadow').setAttribute('fill', c.baseColor);
  slot.querySelector('.bodyTop').setAttribute('fill', c.bodyColor);
  slot.querySelector('.neck').setAttribute('fill', c.neckColor);
  slot.querySelector('.face').setAttribute('fill', c.faceColor);
  slot.querySelector('.backHair').innerHTML = c.backHair;
  const hairKey = s.hair || c.defaultHair;
  const hair = HAIR[hairKey];
  slot.querySelector('.frontHair').innerHTML = hair ? hair.svg : c.backHair;
  slot.querySelector('.headwear').innerHTML = HEADWEAR[s.headwear]?.svg || '';
  slot.querySelector('.clothes').innerHTML = CLOTHES[s.clothes]?.svg || '';
  slot.querySelector('.glasses').innerHTML = GLASSES[s.glasses]?.svg || '';
  setFaceInSlot(slot, key, 'normal');
}
function setFaceInSlot(slot, key, type) {
  const c = CHARS[key];
  const blushL = slot.querySelector('.blushL');
  const blushR = slot.querySelector('.blushR');
  const tearsEl = slot.querySelector('.tears');
  const eyesEl = slot.querySelector('.eyes');
  const mouthEl = slot.querySelector('.mouth');
  const deepBlush = ['blush','shy','star','love'].includes(type);
  blushL.setAttribute('opacity', deepBlush ? '0.85' : '0.55');
  blushR.setAttribute('opacity', deepBlush ? '0.85' : '0.55');
  blushL.setAttribute('rx', deepBlush ? '12' : '10');
  blushR.setAttribute('rx', deepBlush ? '12' : '10');
  tearsEl.style.opacity = (type === 'cry') ? '1' : '0';
  const E = c.eyesStyle;
  const M = {
    normal:`<path d="M94 112 Q100 115 106 112" stroke="#c9736f" stroke-width="2.2" fill="none" stroke-linecap="round"/>`,
    happy:`<path d="M90 110 Q100 120 110 110" stroke="#c9736f" stroke-width="2.5" fill="none" stroke-linecap="round"/>`,
    shy:`<path d="M96 113 Q100 115 104 113" stroke="#c9736f" stroke-width="2.2" fill="none" stroke-linecap="round"/>`,
    sad:`<path d="M92 116 Q100 110 108 116" stroke="#c9736f" stroke-width="2.2" fill="none" stroke-linecap="round"/>`,
    cry:`<path d="M90 114 Q100 110 110 114" stroke="#c9736f" stroke-width="2.5" fill="none" stroke-linecap="round"/>`,
    angry:`<path d="M92 114 L108 114" stroke="#c9736f" stroke-width="2.5" stroke-linecap="round"/>`,
    sleep:`<ellipse cx="100" cy="113" rx="4" ry="3" fill="#c9736f" opacity=".7"/>`,
    star:`<path d="M90 110 Q100 120 110 110" stroke="#c9736f" stroke-width="2.5" fill="none" stroke-linecap="round"/>`,
    blush:`<path d="M95 114 Q100 117 105 114" stroke="#c9736f" stroke-width="2.2" fill="none" stroke-linecap="round"/>`,
    love:`<path d="M90 110 Q100 120 110 110" stroke="#c9736f" stroke-width="2.5" fill="none" stroke-linecap="round"/>`,
    shyLook:`<path d="M95 114 Q100 117 105 114" stroke="#c9736f" stroke-width="2.2" fill="none" stroke-linecap="round"/>`,
    lookUp:`<ellipse cx="100" cy="112" rx="4" ry="4" fill="#c9736f" opacity=".8"/>`,
    soft:`<path d="M92 112 Q100 118 108 112" stroke="#c9736f" stroke-width="2.5" fill="none" stroke-linecap="round"/>`
  };
  eyesEl.innerHTML = E[type] || E.normal;
  mouthEl.outerHTML = (M[type] || M.normal).replace('<path', '<path class="mouth"');
}

/* ================= 场景 ================= */
function setScene(key) {
  currentScene = key;
  const sc = SCENES[key];
  bgLayer.className = key;
  bgDecor.innerHTML = sc.decor;
  save(activeChar);
  say(activeChar, `……${sc.name}。`, 2000);
}
function openScene() {
  choices.classList.remove('show');
  const entries = Object.keys(SCENES).map(k => [k, { emo: SCENES[k].emo, name: SCENES[k].name }]);
  buildPanel('🏠 换个场景', entries, (k) => { setScene(k); openScene(); }, currentScene);
}

/* ================= 模式 ================= */
function applyMode() {
  if (mode === 'qiu') {
    slotQiu.className = 'petSlot single'; slotQiu.style.display = ''; slotHe.style.display = 'none';
    activeChar = 'qiu'; renderChar(slotQiu, 'qiu');
  } else if (mode === 'he') {
    slotHe.className = 'petSlot single'; slotHe.style.display = ''; slotQiu.style.display = 'none';
    activeChar = 'he'; renderChar(slotHe, 'he');
  } else {
    slotQiu.className = 'petSlot duo'; slotHe.className = 'petSlot duo';
    slotQiu.style.display = ''; slotHe.style.display = '';
    activeChar = 'qiu'; renderChar(slotQiu, 'qiu'); renderChar(slotHe, 'he');
  }
  selectPage.classList.add('hide');
  update();
  setTimeout(() => {
    if (mode === 'both') {
      say('qiu', '……她怎么也在这。', 2200);
      setTimeout(() => say('he', '……老大。', 2200), 1400);
    } else {
      say(mode, `我是${CHARS[mode].name}。……你好。`, 2200);
    }
  }, 500);
}

function chooseMode(m) {
  mode = m;
  ['qiu','he'].forEach(k => {
    const s = getState(k);
    const raw = localStorage.getItem('petState_' + k);
    if (raw) {
      try {
        const d = JSON.parse(raw);
        const hours = (Date.now() - d.lastTime) / 3600000;
        s.mood = Math.max(0, d.mood - hours * 2);
        s.food = Math.max(0, d.food - hours * 4);
        s.love = d.love || 0;
        s.angry = Math.max(0, (d.angry || 0) - hours * 10);
        s.sad   = Math.max(0, (d.sad   || 0) - hours * 10);
        s.clothes = d.clothes || 'basic';
        s.headwear = d.headwear || 'none';
        s.hair = d.hair || null;
        s.glasses = d.glasses || 'none';
        s.bag = d.bag || [];
      } catch(e) {}
    }
  });
  applyMode();
  // 场景
  const sc = localStorage.getItem('scene') || 'dorm';
  setScene(sc);
  localStorage.setItem('mode', mode);
  // 启动空闲聊天
  startIdleChat();
}
function showSelect() {
  selectPage.classList.remove('hide');
  choices.classList.remove('show'); closePanel();
  stopIdleChat();
}

/* ================= 气泡 ================= */
function say(charKey, text, ms = 2400) {
  const slot = charKey === 'qiu' ? slotQiu : slotHe;
  if (slot.style.display === 'none' && mode !== 'both') return;
  const bubble = document.createElement('div');
  bubble.className = 'bubble ' + charKey;
  bubble.textContent = text;
  document.body.appendChild(bubble);
  const r = slot.getBoundingClientRect();
  const bw = bubble.offsetWidth;
  let left = r.left + r.width/2 - bw/2;
  left = Math.max(8, Math.min(window.innerWidth - bw - 8, left));
  const top = r.top - bubble.offsetHeight - 10;
  bubble.style.left = left + 'px';
  bubble.style.top  = Math.max(48, top) + 'px';
  requestAnimationFrame(() => bubble.classList.add('show'));
  setTimeout(() => { bubble.classList.remove('show'); setTimeout(() => bubble.remove(), 350); }, ms);
}
function rand(arr) { return arr[Math.floor(Math.random() * arr.length)]; }
function floatText(txt, x, y) {
  const el = document.createElement('div');
  el.className = 'float';
  el.textContent = txt;
  el.style.left = (x - 14) + 'px';
  el.style.top  = (y - 20) + 'px';
  document.body.appendChild(el);
  setTimeout(() => el.remove(), 1000);
}
function showToast(text, type) {
  toastEl.textContent = text;
  toastEl.className = 'show ' + (type || '');
  setTimeout(() => toastEl.className = '', 1800);
}

/* ================= 物品飞行 ================= */
function itemFlyToPet(emo, key) {

/* ================= 状态 ================= */
function getLevel(love) {
  let cur = LEVELS[0];
  for (const l of LEVELS) if (love >= l.min) cur = l;
  return cur;
}
function lovePercent(love) {
  const cur = getLevel(love);
  const idx = LEVELS.indexOf(cur);
  const next = LEVELS[idx + 1];
  if (!next) return 100;
  return Math.min(100, ((love - cur.min) / (next.min - cur.min)) * 100);
}
function render() {
  const s = st();
  moodFill.style.width = s.mood + '%';
  foodFill.style.width = s.food + '%';
  loveFill.style.width = lovePercent(s.love) + '%';
  angryFill.style.width = s.angry + '%';
  sadFill.style.width = s.sad + '%';
  loveLv.textContent = `Lv.${getLevel(s.love).lv}`;
  bagCount.textContent = s.bag.length;
  const btn = document.getElementById('apologyBtn');
  if (s.angry >= 60 || s.sad >= 50) btn.classList.add('apologize');
  else btn.classList.remove('apologize');
}
function update() {
  const s = st();
  s.mood = Math.max(0, Math.min(100, s.mood));
  s.food = Math.max(0, Math.min(100, s.food));
  s.angry = Math.max(0, Math.min(100, s.angry));
  s.sad = Math.max(0, Math.min(100, s.sad));
  s.love = Math.max(0, s.love);
  render(); save(activeChar);
}
function save(key) {
  const s = getState(key);
  s.lastTime = Date.now();
  localStorage.setItem('petState_' + key, JSON.stringify(s));
  if (key === activeChar) localStorage.setItem('scene', currentScene);
}
function saveAll() { save('qiu'); save('he'); }

/* ================= 情绪 ================= */
function addLove(key, n) {
  const s = getState(key);
  const before = getLevel(s.love).lv;
  s.love = Math.max(0, s.love + n);
  const after = getLevel(s.love);
  if (after.lv > before) showToast(`💗 ${CHARS[key].name} 好感提升！${after.name}`, 'love');
}
function isAngry(key) { return getState(key).angry >= 60; }
function isSad(key)   { return getState(key).sad >= 50; }
function isRage(key)  { return getState(key).angry >= 90; }

function addAngry(key, n) {
  const s = getState(key);
  const was = s.angry >= 60;
  const wasRage = s.angry >= 90;
  s.angry = Math.min(100, s.angry + n);
  if (!was && s.angry >= 60) {
    showToast(`😠 ${CHARS[key].name}生气了！`, 'angry');
    shakeSlot(key);
    say(key, rand(CHARS[key].angry.lines), 2800);
    setFaceFor(key, 'angry');
  }
  if (!wasRage && s.angry >= 90) {
    // 生气极了：骂人 + 扔东西
    showToast(`💢 ${CHARS[key].name}暴怒了！`, 'angry');
    setTimeout(() => {
      say(key, rand(CHARS[key].angry.rage), 3000);
      setFaceFor(key, 'angry');
      shakeSlot(key);
      // 连扔3个东西
      for (let i = 0; i < 3; i++) setTimeout(() => throwItem(key), i * 200);
    }, 400);
  }
}
function calmDown(key, n) {
  if (n <= 0) return;
  const s = getState(key);
  const before = s.angry;
  s.angry = Math.max(0, s.angry - n);
  if (before >= 60 && s.angry < 60 && s.angry > 0) {
    showToast('😌 她没那么气了', 'calm');
    setFaceFor(key, 'shy'); say(key, rand(CHARS[key].angry.soft), 2200);
  }
  if (before > 0 && s.angry === 0) {
    showToast('😊 她原谅你了', 'calm');
    setFaceFor(key, 'happy');
  }
}
function addSad(key, n) {
  const s = getState(key);
  const was = s.sad >= 50;
  s.sad = Math.min(100, s.sad + n);
  s.mood = Math.max(0, s.mood - n * 0.5);
  if (!was && s.sad >= 50) {
    showToast('💧 她伤心了…', 'sad');
    setFaceFor(key, 'cry');
    say(key, rand(CHARS[key].sadLines.lines), 3000);
    if (s.sad >= 70) scheduleLeave(key);
  }
}
function calmSad(key, n) {
  if (n <= 0) return;
  const s = getState(key);
  const before = s.sad;
  s.sad = Math.max(0, s.sad - n);
  if (before >= 50 && s.sad < 50 && s.sad > 0) showToast('💙 她好受一点了', 'calm');
  if (before > 0 && s.sad === 0) { showToast('😊 她不难过了', 'calm'); setFaceFor(key, 'happy'); }
}
/* 伤心消失：说伤心话 + 消失 */
function scheduleLeave(key) {
  const s = getState(key);
  if (s.away) return;
  setTimeout(() => {
    if (s.sad < 60) return;
    s.away = true;
    say(key, rand(CHARS[key].sadLines.vanish), 2500);
    setFaceFor(key, 'cry');
    const slot = key === 'qiu' ? slotQiu : slotHe;
    setTimeout(() => {
      slot.classList.add('away');
      setTimeout(() => {
        s.away = false;
        slot.classList.remove('away');
        s.sad = Math.max(0, s.sad - 25);
        update();
        say(key, '……我回来了。', 2500);
        setFaceFor(key, 'sad');
      }, 30000);
    }, 1200);
  }, 1500);
}
function setFaceFor(key, type) {
  const slot = key === 'qiu' ? slotQiu : slotHe;
  if (slot.style.display === 'none') return;
  setFaceInSlot(slot, key, type);
}
function shakeSlot(key) {
  const slot = key === 'qiu' ? slotQiu : slotHe;
  slot.classList.remove('shake'); void slot.offsetWidth; slot.classList.add('shake');
}

/* ================= 点击 ================= */
function bindPetClick(slot, key) {
  slot.addEventListener('click', (e) => {
    lastUserAction = Date.now();
    const s = getState(key);
    if (s.away) return;
    if (mode === 'both') { activeChar = key; update(); }

    const rect = slot.getBoundingClientRect();
    const y = (e.clientY - rect.top) / rect.height;
    const x = (e.clientX - rect.left) / rect.width;
    const c = CHARS[key];

    if (isAngry(key)) {
      const now = Date.now();
      if (now - s.lastTap < 1200) { addAngry(key, 4); say(key, rand(c.angry.overTap), 2000); }
      else { say(key, rand(c.angry.lines), 2000); }
      s.lastTap = now;
      setFaceFor(key, 'angry'); shakeSlot(key);
      if (mode === 'both') partnerReact(key, 'angry');
      return;
    }
    if (isSad(key)) {
      say(key, rand(c.sadLines.cry), 2200);
      setFaceFor(key, 'cry'); calmSad(key, 3);
      if (mode === 'both') partnerReact(key, 'sad');
      return;
    }

    slot.classList.remove('happy'); void slot.offsetWidth; slot.classList.add('happy');
    const now = Date.now();
    if (now - s.lastTap < 700) s.tapCount++;
    else s.tapCount = 1;
    s.lastTap = now;

    let face = 'normal', line = 'tap', loveAdd = 1;
    if (y < 0.45) {
      if (x > 0.35 && x < 0.65 && y > 0.30) {
        face = 'angry'; line = 'faceTap'; loveAdd = 0;
        addAngry(key, 5); floatText('💢', e.clientX, e.clientY);
      } else {
        face = 'shy'; line = 'head'; loveAdd = 2;
        floatText('🫶', e.clientX, e.clientY);
      }
    } else if (y > 0.78) {
      face = 'angry'; line = 'body'; loveAdd = 0;
      addAngry(key, 4); floatText('💢', e.clientX, e.clientY);
    } else {
      face = s.mood > 60 && Math.random() < 0.5 ? 'happy' : 'shy';
      line = 'tap'; loveAdd = 1;
      floatText('💕', e.clientX, e.clientY);
    }
    if (s.tapCount >= 5) { addAngry(key, 8); s.tapCount = 0; }

    s.mood = Math.min(100, s.mood + 2);
    addLove(key, loveAdd);
    update();
    say(key, rand(c.lines[line]), 2400);
    setFaceFor(key, face);
  });
}
bindPetClick(slotQiu, 'qiu');
bindPetClick(slotHe, 'he');

  if (type === 'angry') {
    if (partnerKey === 'he') {
      // 何芬：护着老大、劝和

        '……老大，别生气了。',

        '……她其实不坏。',
        '……嗯，我陪你。',
        '……老大，消消气。',
        '……别气坏了。'
      ]), 2600);
      setFaceFor('he', 'shy');
    } else {
      // 邱禧悦：看戏/护短/记仇
      say('qiu', rand([
        '……活该。',
        '……哼，早说了。',
        '……别欺负她。',
        '……你等着。',
        '……我记着了。',
        '……你是不是欠收拾。'
      ]), 2600);
      setFaceFor('qiu', 'angry');
    }
  } else if (type === 'sad') {
    if (partnerKey === 'he') {
      // 何芬：心疼老大
      say('he', rand([
        '……老大，别难过。',
        '……（拍拍她）',
        '……我在。',
        '……嗯，我陪你。',
        '……别理他。',
        '……老大……'
      ]), 2600);
      setFaceFor('he', 'shy');
    } else {
      // 邱禧悦：护短、报复、骂人
      say('qiu', rand([
        '……谁欺负你了？',
        '……告诉我，我记他。',
        '……别哭了。',
        '……我帮你出头。',
        '……你等着，我收拾他。',
        '……谁啊，说名字。'
      ]), 2600);
      setFaceFor('qiu', 'angry');
    }
  }
}

/* ================= 聊天 ================= */
function chat() {
  lastUserAction = Date.now();
  closePanel();
  const key = activeChar;
  const c = CHARS[key];
  const s = getState(key);
  if (s.away) { say(key, '……（她不在）', 2000); return; }
  if (isAngry(key)) {
    say(key, rand(['……现在不想说话。','……哼。','……干嘛。','……别烦我。']), 2500);
    setFaceFor(key, 'angry'); calmDown(key, 6); update(); return;
  }
  if (isSad(key)) {
    say(key, rand(['……','……嗯。','……你说吧。','……嗯。']), 2500);
    setFaceFor(key, 'sad'); calmSad(key, 5); update(); return;
  }
  const lv = getLevel(s.love).lv;
  const available = c.topics.filter(t => t.minLv <= lv);
  const pool = [...available].sort(() => Math.random() - 0.5).slice(0, 3);
  choices.innerHTML = '';
  pool.forEach(t => {
    const btn = document.createElement('button');
    btn.innerHTML = `<span class="emo">${t.emo}</span>${t.q}`;
    btn.onclick = () => askTopic(key, t);
    choices.appendChild(btn);
  });
  choices.classList.add('show');
  say(key, '……你想问什么？', 3000);
  setFaceFor(key, 'normal');
}
function askTopic(key, t) {
  lastUserAction = Date.now();
  choices.classList.remove('show');
  const s = getState(key);
  say(key, rand(t.a), 3200);
  setFaceFor(key, t.face || 'normal');
  addLove(key, t.love || 2);
  s.mood = Math.min(100, s.mood + 2);
  calmDown(key, 12); calmSad(key, 12);
  update();
}

/* ================= 面板 ================= */
function buildPanel(title, entries, onClick, activeKey) {
  panelTitle.textContent = title;
  panelGrid.innerHTML = '';
  entries.forEach(([k, v]) => {
    const d = document.createElement('div');
    d.className = 'item' + (activeKey === k ? ' active' : '');
    d.innerHTML = `${v.emo || '👗'}<span>${v.name}</span>`;
    d.onclick = () => onClick(k);
    panelGrid.appendChild(d);
  });
  panel.classList.add('show');
}
function openItems() {
  lastUserAction = Date.now();
  choices.classList.remove('show');
  const entries = Object.keys(ITEMS).map(k => [k, { emo: ITEMS[k].emo, name: ITEMS[k].name }]);
  buildPanel('🎁 选一个送给她', entries, (k) => useItem(k));
}
function openClothes() {
  lastUserAction = Date.now();
  choices.classList.remove('show');
  const s = st();
  const entries = Object.keys(CLOTHES).map(k => [k, { emo: CLOTHES[k].emo, name: CLOTHES[k].name }]);
  buildPanel('👗 换衣服', entries, (k) => {
    s.clothes = k; redrawActive(); say(activeChar, '……这件？', 1800);
    setFaceFor(activeChar, 'shy'); addLove(activeChar, 1); update(); openClothes();
  }, s.clothes);
}
function openHeadwear() {
  lastUserAction = Date.now();
  choices.classList.remove('show');
  const s = st();
  const entries = Object.keys(HEADWEAR).map(k => [k, { emo: HEADWEAR[k].emo, name: HEADWEAR[k].name }]);
  buildPanel('🎀 换头饰', entries, (k) => {
    s.headwear = k; redrawActive(); say(activeChar, '……好看吗？', 1800);
    setFaceFor(activeChar, 'shy'); addLove(activeChar, 1); update(); openHeadwear();
  }, s.headwear);
}
function openHair() {
  lastUserAction = Date.now();
  choices.classList.remove('show');
  const s = st();
  const entries = Object.keys(HAIR).map(k => [k, { emo: HAIR[k].emo, name: HAIR[k].name }]);
  buildPanel('💇 换发型', entries, (k) => {
    s.hair = k; redrawActive(); say(activeChar, '……这个发型？', 1800);
    setFaceFor(activeChar, 'shy'); addLove(activeChar, 1); update(); openHair();
  }, s.hair || CHARS[activeChar].defaultHair);
}
function openGlasses() {
  lastUserAction = Date.now();
  choices.classList.remove('show');
  const s = st();
  const entries = Object.keys(GLASSES).map(k => [k, { emo: GLASSES[k].emo, name: GLASSES[k].name }]);
  buildPanel('👓 换眼镜', entries, (k) => {
    s.glasses = k; redrawActive(); say(activeChar, '……怎么样？', 1800);
    setFaceFor(activeChar, 'shy'); addLove(activeChar, 1); update(); openGlasses();
  }, s.glasses);
}
function openMean() {
  lastUserAction = Date.now();
  choices.classList.remove('show');
  const entries = MEAN.map((m, i) => [i, { emo: m.emo, name: m.q.slice(0, 4) }]);
  buildPanel('😈 欺负她（会伤心）', entries, (i) => meanAction(MEAN[i]));
}
function openBag() {
  lastUserAction = Date.now();
  choices.classList.remove('show');
  const s = st();
  if (s.bag.length === 0) { say(activeChar, '……我还没送过你东西呢。', 2500); return; }
  const counts = {};
  s.bag.forEach(g => counts[g] = (counts[g] || 0) + 1);
  const entries = Object.keys(counts).map(k => [k, { emo: ITEMS[k]?.emo || '🎁', name: `${ITEMS[k]?.name || k}×${counts[k]}` }]);
  buildPanel('🎒 她送你的礼物', entries, () => {});
}
function closePanel() { panel.classList.remove('show'); }
function redrawActive() {
  const key = activeChar;
  const slot = key === 'qiu' ? slotQiu : slotHe;
  if (slot.style.display !== 'none') applyCharToSlot(slot, key);
  save(key);
}

document.addEventListener('click', (e) => {
  lastUserAction = Date.now();
  if (!choices.contains(e.target) && !e.target.closest('#actions') && !panel.contains(e.target) && !e.target.closest('#giftBag') && !e.target.closest('#switchChar')) {
    choices.classList.remove('show'); closePanel();
  }
});

/* ================= 送礼物 ================= */
function useItem(key) {
  lastUserAction = Date.now();
  const it = ITEMS[key]; if (!it) return;
  const ck = activeChar;
  const s = getState(ck);
  const isA = s.angry >= 30, isS = s.sad >= 30;

  itemFlyToPet(it.emo, ck);

  setTimeout(() => {
    if (isA) {
      say(ck, rand(['……哼。','……干嘛。','……这次就算了。','……嗯。']), 2800);
      setFaceFor(ck, 'shy');
    } else if (isS) {
      say(ck, rand(['……嗯。','……谢谢。','……好一点了。','……嗯。']), 2800);
      setFaceFor(ck, 'shy'); calmSad(ck, 20);
    } else {
      say(ck, rand(it.lines), 2800);
      setFaceFor(ck, it.face || 'shy');
    }
    s.mood = Math.min(100, s.mood + (it.mood || 0));
    s.food = Math.min(100, s.food + (it.food || 0));
    addLove(ck, isA || isS ? Math.ceil((it.love || 3) / 2) : (it.love || 3));
    calmDown(ck, it.calm || 20);
    if (isS) calmSad(ck, it.calm || 20);
    update();
    if (s.currentRequest && s.currentRequest.want === key) {
      say(ck, '……就是这个。谢谢你。', 3000);
      addLove(ck, 8);
      showToast('💗 她很高兴！', 'love');
      s.currentRequest = null;
    }
    for (let i = 0; i < 6; i++) setTimeout(() => spawnHeart(), i * 100);
    if (mode === 'both') {
      setTimeout(() => {
        const pk = ck === 'qiu' ? 'he' : 'qiu';
        if (pk === 'he') say('he', '……老大开心就好。', 2200);
        else say('qiu', '……哼。', 2200);
      }, 1200);
    }
  }, 700);
  closePanel();
}
function spawnHeart() {
  const h = document.createElement('div');
  h.className = 'heart';
  h.textContent = rand(['✨','💫','🌸','💛','⭐']);
  h.style.left = (20 + Math.random() * 60) + 'vw';
  h.style.top  = (35 + Math.random() * 20) + 'vh';
  document.body.appendChild(h);
  setTimeout(() => h.remove(), 1700);
}

/* ================= 欺负 ================= */
function meanAction(m) {
  lastUserAction = Date.now();
  closePanel();
  const key = activeChar;
  if (m.emo !== '💔') {
    itemFlyToPet(m.emo, key);
    setTimeout(() => doMeanEffect(key, m), 600);
  } else {
    doMeanEffect(key, m);
  }
}
function doMeanEffect(key, m) {
  addSad(key, m.sad);
  addAngry(key, m.sad * 0.3);
  addLove(key, -2);
  const s = getState(key);
  s.mood = Math.max(0, s.mood - 5);
  update();
  say(key, rand(m.reply), 3000);
  setFaceFor(key, m.face || 'sad');
  const slot = key === 'qiu' ? slotQiu : slotHe;
  const r = slot.getBoundingClientRect();
  if (m.emo === '⚽') floatText('💥', r.left + r.width/2, r.top + 40);
  else if (m.emo === '💥') floatText('💥', r.left + r.width/2, r.top + 40);
  else floatText('💔', r.left + r.width/2, r.top + 40);
  if (mode === 'both') setTimeout(() => partnerReact(key, m.sad >= 25 ? 'sad' : 'angry'), 900);
}

/* ================= 道歉 ================= */
function apologize() {
  lastUserAction = Date.now();
  closePanel(); choices.classList.remove('show');
  const key = activeChar;
  const s = getState(key);
  if (s.away) { say(key, '……（她不在）', 2000); return; }
  const wasA = isAngry(key), wasS = isSad(key);
  if (!wasA && !wasS) {
    say(key, rand(['……干嘛道歉。','我又没生气。','……嗯，知道了。','……嗯。']), 2200);
    setFaceFor(key, 'shy'); return;
  }
  if (wasA) calmDown(key, rand([25,28,30,35]));
  if (wasS) calmSad(key, rand([25,28,30,35]));
  addLove(key, 2);
  s.mood = Math.min(100, s.mood + 5);
  update();
  if (isAngry(key) || isSad(key)) {
    say(key, rand(['……哼。','……还没消气。','……再哄哄。','……嗯。']), 2200);
    setFaceFor(key, wasS ? 'sad' : 'angry');
  } else {
    say(key, rand(['……好吧。','……原谅你了。','……这次就算了。','……嗯。']), 2600);
    setFaceFor(key, 'shy');
  }
  const slot = key === 'qiu' ? slotQiu : slotHe;
  const r = slot.getBoundingClientRect();
  floatText('🙇', r.left + r.width/2, r.top);
}

/* ================= 她送礼物 ================= */
function giveGiftToUser(key) {
  const s = getState(key);
  const keys = Object.keys(ITEMS);
  const k = rand(keys);
  const it = ITEMS[k];
  s.bag.push(k);
  save(key); if (key === activeChar) render();

  itemFlyFromPet(it.emo, key);
  showToast(`🎁 ${CHARS[key].name}送了你${it.name}！`, 'gift');
  let line;
  if (key === 'qiu') line = rand(['……这个给你。','……拿着，别弄丢了。','……看到就想到你了。','……哼，不是特意给你的。','……收好。','……不喜欢就还我。']);
  else line = rand(['……这个给你。','……拿着吧。','……看到就想到你了。','……不是什么好东西。','……嗯。','……你收下就好。']);
  say(key, line, 3000);
  setFaceFor(key, 'shy');
  addLove(key, 3);
  update();
}

/* ================= 提要求 ================= */
function makeRequest(key) {
  const s = getState(key);
  const c = CHARS[key];
  const req = rand(c.requests);
  s.currentRequest = req;
  say(key, req.text, 3500);
  setFaceFor(key, 'shy');
  showToast(`${req.emo} ${c.name}想要什么…`, 'love');
  const slot = key === 'qiu' ? slotQiu : slotHe;
  const r = slot.getBoundingClientRect();
  floatText(req.emo, r.left + r.width/2, r.top + 30);
}

/* ================= 撒娇 ================= */
function coquetry(key) {
  const c = CHARS[key];
  const slot = key === 'qiu' ? slotQiu : slotHe;
  slot.classList.add('lean');
  setTimeout(() => slot.classList.remove('lean'), 2400);
  say(key, rand(c.coquettish), 2800);
  setFaceFor(key, 'shy');
}

/* ================= 她欺负用户 ================= */
function meanToUser(key) {
  if (key === 'qiu') {
    const lines = ['……上次的事我还记着呢。','……你今天怎么这么闲。','……哼，别以为我忘了。','……你是不是又偷懒了。','……我记仇的。','……你怎么还不理我。','……3年了，你还不懂我。','……算了。'];
    say(key, rand(lines), 3000);
    setFaceFor(key, 'angry');
  } else {
    const lines = ['……你今天都没理我。','……哼。','……别走。','……陪我。','……你去哪了。','……我以为你不来了。','……嗯。','……你忙就算了。'];
    say(key, rand(lines), 3000);
    setFaceFor(key, 'sad');
  }
  getState(key).mood = Math.max(0, getState(key).mood - 3);
  update();
}

/* ============================================================
   双人自主互动（≥10 套台本，含吵架、吐槽、送东西）
   ============================================================ */
const DUO_SCRIPTS = [
  // 1. 日常
  { a:'qiu', b:'he', lines:[['……何芬，过来。','……嗯。'],['……你今天怎么这么安静。','……没什么。'],['……别发呆，帮我看着点。','……好。'],['……哼，也就你还听我的。','……因为你是老大。']] },
  // 2. 一起吃饭
  { a:'qiu', b:'he', lines:[['……该吃饭了。','……嗯。'],['……你想吃什么。','……都行。'],['……那就楼下那家。','……好。'],['……我请你。','……谢谢老大。']] },
  // 3. 护短
  { a:'qiu', b:'he', lines:[['……谁欺负你了？','……没有。'],['……别骗我。','……真的没有。'],['……有就告诉我。','……嗯。']] },
  // 4. 何芬道谢
  { a:'he', b:'qiu', lines:[['……老大。','……干嘛。'],['……谢谢你。','……少来。'],['……3年了，一直照顾我。','……嗯。'],['……我会记着的。','……知道了。']] },
  // 5. 吵架（小）
  { a:'qiu', b:'he', lines:[['……你昨天又没收拾。','……忘了。'],['……说了多少次。','……对不起。'],['……算了。','……嗯。'],['……下次注意。','……好。']] },
  // 6. 吐槽用户
  { a:'qiu', b:'he', lines:[['……他今天又没来。','……嗯。'],['……你说他是不是忘了我们。','……可能忙。'],['……哼。','……嗯。']] },
  // 7. 何芬关心
  { a:'he', b:'qiu', lines:[['……老大，你脸色不好。','……没事。'],['……是不是没睡好。','……嗯。'],['……那你休息。','……好。']] },
  // 8. 邱禧悦记仇
  { a:'qiu', b:'he', lines:[['……我还记得上次那事。','……哪次。'],['……你忘了？','……嗯。'],['……算了。','……对不起。']] },
  // 9. 送东西
  { a:'qiu', b:'he', lines:[['……这个给你。','……什么。'],['……奶茶。','……谢谢老大。'],['……哼。','……嗯。']] },
  // 10. 夜晚
  { a:'he', b:'qiu', lines:[['……老大，睡不着。','……数羊。'],['……数了。','……那我陪你。'],['……嗯。','……别多想。']] },
  // 11. 吐槽用户（升级）
  { a:'qiu', b:'he', lines:[['……他最近是不是烦我们。','……没有吧。'],['……哼。','……老大你别多想。'],['……嗯。','……我在。']] },
  // 12. 回忆3年
  { a:'he', b:'qiu', lines:[['……老大，我们认识3年了。','……嗯。'],['……时间好快。','……是。'],['……谢谢你。','……少来。']] },
  // 13. 吵架（升级）
  { a:'qiu', b:'he', lines:[['……你能不能别老这样。','……哪样。'],['……什么都不说。','……我……'],['……算了。','……对不起。'],['……嗯。','……我改。']] },
  // 14. 何芬委屈
  { a:'he', b:'qiu', lines:[['……老大……','……怎么了。'],['……没事。','……说。'],['……他今天说我烦。','……我去找他。'],['……不用。','……哼。']] }
];

function duoInteract() {
  if (mode !== 'both') return;
  const sQ = getState('qiu'), sH = getState('he');
  if (sQ.away || sH.away) return;
  if (sQ.angry >= 60 || sH.angry >= 60) return;
  if (sQ.sad >= 50 || sH.sad >= 50) return;

  const d = rand(DUO_SCRIPTS);
  const pair = rand(d.lines);
  const [l1, l2] = pair;
  const [first, second] = d.a === 'qiu' ? ['qiu', 'he'] : ['he', 'qiu'];
  const lineA = d.a === first ? l1 : l2;
  const lineB = d.a === first ? l2 : l1;

  say(first, lineA, 2000);
  const slotA = first === 'qiu' ? slotQiu : slotHe;
  const slotB = second === 'qiu' ? slotQiu : slotHe;
  slotA.classList.add('talking');
  setTimeout(() => {
    slotA.classList.remove('talking');
    slotB.classList.add('talking');
    say(second, lineB, 2000);
  }, 1300);
  setTimeout(() => slotB.classList.remove('talking'), 2600);
}

/* ================= 空闲自动聊天（用户5秒不动） ================= */
function startIdleChat() {
  stopIdleChat();
  idleChatTimer = setInterval(() => {
    // 用户5秒不动 + 双人模式
    if (Date.now() - lastUserAction < 5000) return;
    if (mode !== 'both') {
      // 单人模式：自己说话
      const key = activeChar;
      const s = getState(key);
      if (s.away || s.angry >= 60 || s.sad >= 50) return;
      if (choices.classList.contains('show') || panel.classList.contains('show')) return;
      if (Math.random() < 0.35) {
        const c = CHARS[key];
        const pool = [...c.lines.idle, ...c.lines.warm];
        say(key, rand(pool), 2400);
      }
      return;
    }
    // 双人模式：自主互动
    if (Math.random() < 0.5) {
      duoInteract();
    } else {
      // 或者单人自言自语
      const key = Math.random() < 0.5 ? 'qiu' : 'he';
      const s = getState(key);
      if (s.away || s.angry >= 60 || s.sad >= 50) return;
      const c = CHARS[key];
      say(key, rand(c.lines.idle), 2400);
    }
  }, 4000);
}
function stopIdleChat() {
  if (idleChatTimer) { clearInterval(idleChatTimer); idleChatTimer = null; }
}

/* ================= 定时 ================= */
setInterval(() => {
  ['qiu','he'].forEach(key => {
    const s = getState(key);
    s.mood = Math.max(0, s.mood - 0.5);
    s.food = Math.max(0, s.food - 1.0);
    if (s.angry > 0) s.angry = Math.max(0, s.angry - 1.5);
    if (s.sad > 0)   s.sad   = Math.max(0, s.sad   - 1.0);
  });
  render(); saveAll();

  ['qiu','he'].forEach(key => {
    const s = getState(key);
    const slot = key === 'qiu' ? slotQiu : slotHe;
    if (slot.style.display === 'none') return;
    if (s.away || s.angry >= 60 || s.sad >= 50) return;
    if (choices.classList.contains('show') || panel.classList.contains('show')) return;
    // 用户5秒内有操作就不主动说
    if (Date.now() - lastUserAction < 5000) return;

    if (Math.random() < 0.08) {
      const c = CHARS[key];
      if (s.food < 25) { say(key, rand(c.lines.hungry), 2200); setFaceFor(key, 'sad'); }
      else if (s.mood < 25) { say(key, rand(c.lines.sad), 2200); setFaceFor(key, 'sad'); }
      else { say(key, rand(c.lines.idle), 2200); }
    }
    if (Math.random() < 0.06 && s.mood > 65 && s.love > 50) coquetry(key);
    // 开心送东西
    if (Math.random() < 0.05 && s.mood > 70 && s.love > 60) giveGiftToUser(key);
    if (Math.random() < 0.05 && s.love > 40 && !s.currentRequest) makeRequest(key);
    if (Math.random() < 0.03 && s.love > 30) meanToUser(key);
  });

  // 双人互动
  if (mode === 'both' && Math.random() < 0.08) duoInteract();

  saveAll();
}, 8000);

window.addEventListener('beforeunload', saveAll);
document.addEventListener('visibilitychange', () => { if (document.hidden) saveAll(); });

/* ================= 启动 ================= */
const savedMode = localStorage.getItem('mode');
if (savedMode && (CHARS[savedMode] || savedMode === 'both')) {
  chooseMode(savedMode);
} else {
  selectPage.classList.remove('hide');
}
</script>
