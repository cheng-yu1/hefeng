<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>何芬 · 桌宠</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body { height:100%; overflow:hidden; font-family:-apple-system,"PingFang SC",sans-serif; }
  body {
    background: linear-gradient(160deg,#ffeef2,#e8f4f8 55%,#f3e8ff);
    display:flex; flex-direction:column; align-items:center; justify-content:flex-end;
    user-select:none;
    transition: background 1s;
  }
  /* 温度影响背景 */
  body.cold { background: linear-gradient(160deg,#dceeff,#c8e0f5 55%,#e8f0ff); }
  body.hot  { background: linear-gradient(160deg,#ffe8d0,#ffd6b8 55%,#ffe0cc); }

  #stats {
    position:fixed; top:0; left:0; right:0; z-index:10;
    padding:8px 8px; display:flex; gap:6px; justify-content:center; align-items:center;
    background:rgba(255,255,255,.68); backdrop-filter:blur(10px);
    font-size:11px; color:#345; flex-wrap:wrap;
  }
  .bar { width:50px; }
  .bar-label { font-size:9px; margin-bottom:2px; white-space:nowrap; }
  .bar-bg { height:6px; background:rgba(0,0,0,.1); border-radius:4px; overflow:hidden; }
  .bar-fill { height:100%; border-radius:4px; transition:width .4s; }
  #moodFill { background:linear-gradient(90deg,#ff9a9e,#fad0c4); }
  #foodFill { background:linear-gradient(90deg,#84fab0,#8fd3f4); }
  #loveFill { background:linear-gradient(90deg,#ff7eb3,#ff9a5a); }
  #angryFill { background:linear-gradient(90deg,#ff6b6b,#ff9f43); }
  #sadFill { background:linear-gradient(90deg,#7fa8d8,#a8c8f0); }
  #loveLv { font-size:9px; color:#e0629a; font-weight:700; }

  /* 温度显示 */
  #tempBadge {
    position:fixed; top:44px; left:8px; z-index:15;
    background:rgba(255,255,255,.85); backdrop-filter:blur(8px);
    border-radius:14px; padding:5px 10px; font-size:12px; font-weight:700;
    box-shadow:0 2px 10px rgba(0,0,0,.1); cursor:pointer;
    color:#456;
  }

  #petWrap {
    position:relative;
    margin-bottom:26vh;
    animation: idle 2.6s ease-in-out infinite;
    transition: transform .15s, opacity .6s;
    cursor:pointer;
    filter: drop-shadow(0 12px 20px rgba(0,0,0,.2));
    touch-action: manipulation;
  }
  #petWrap:active { transform:scale(.94); }
  #petWrap.away { opacity:0; transform:translateX(120px) scale(.7); pointer-events:none; }
  @keyframes idle {
    0%,100% { transform:translateY(0) rotate(0deg); }
    50%     { transform:translateY(-10px) rotate(-1.5deg); }
  }
  @keyframes happy {
    0%,100% { transform:translateY(0) scale(1); }
    30%     { transform:translateY(-28px) scale(1.12); }
    60%     { transform:translateY(0) scale(.94); }
  }
  .happy { animation: happy .6s ease; }
  @keyframes shake {
    0%,100% { transform:translateX(0); }
    20%     { transform:translateX(-8px) rotate(-2deg); }
    40%     { transform:translateX(8px) rotate(2deg); }
    60%     { transform:translateX(-6px); }
    80%     { transform:translateX(6px); }
  }
  .shake { animation: shake .45s ease; }
  @keyframes lean {
    0%,100% { transform:translateY(0) rotate(0deg); }
    50%     { transform:translateY(-14px) rotate(3deg) scale(1.04); }
  }
  .lean { animation: lean 1.2s ease-in-out infinite; }
  @keyframes shiver {
    0%,100% { transform:translateX(0); }
    25%     { transform:translateX(-2px); }
    75%     { transform:translateX(2px); }
  }
  .shiver { animation: shiver .18s ease-in-out infinite; }

  #pet {
    width: 62vmin;
    max-width: 340px;
    height: 74vmin;
    max-height: 410px;
  }
  #pet svg { width:100%; height:100%; display:block; }

  #bubble {
    position:fixed;
    background:#fff; padding:9px 15px; border-radius:16px;
    font-size:14px; color:#345; max-width:76vw; text-align:center;
    box-shadow:0 4px 14px rgba(0,0,0,.13);
    opacity:0; transition:opacity .3s, transform .3s;
    transform:translateY(6px); pointer-events:none; z-index:20;
  }
  #bubble.show { opacity:1; transform:translateY(0); }
  #bubble::after {
    content:''; position:absolute; bottom:-7px; left:50%; transform:translateX(-50%);
    border:7px solid transparent; border-top-color:#fff; border-bottom:0;
  }

  #choices {
    position:fixed; bottom:27vh; left:0; right:0;
    display:flex; flex-direction:column; gap:7px; align-items:center;
    padding:0 18px; z-index:11;
    opacity:0; transform:translateY(10px); pointer-events:none;
    transition:opacity .25s, transform .25s;
  }
  #choices.show { opacity:1; transform:translateY(0); pointer-events:auto; }
  #choices button {
    width:100%; max-width:320px; padding:11px 16px;
    border:none; border-radius:14px; font-size:14px; text-align:left;
    background:rgba(255,255,255,.96); color:#456;
    box-shadow:0 3px 12px rgba(0,0,0,.1);
    cursor:pointer; transition:transform .1s, background .2s;
  }
  #choices button:active { transform:scale(.97); background:#fff0f5; }
  #choices button .emo { margin-right:8px; }

  #panel {
    position:fixed; bottom:20vh; left:50%; transform:translate(-50%,10px);
    background:rgba(255,255,255,.97); border-radius:20px;
    padding:14px; z-index:30;
    box-shadow:0 10px 34px rgba(0,0,0,.18);
    display:none;
    width:90vw; max-width:380px;
    max-height:52vh; overflow-y:auto;
  }
  #panel.show { display:block; animation:pop .25s ease; }
  @keyframes pop { from { opacity:0; transform:translate(-50%,20px) scale(.95); } }
  #panel h3 { font-size:14px; color:#e0629a; margin-bottom:10px; text-align:center; }
  #panel .grid { display:flex; gap:8px; justify-content:center; flex-wrap:wrap; }
  #panel .item {
    width:62px; height:62px; border-radius:16px;
    background:#fff5f8; border:2px solid transparent;
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    font-size:24px; cursor:pointer; transition:transform .1s, border-color .2s;
  }
  #panel .item:active { transform:scale(.9); }
  #panel .item.active { border-color:#ff9ec4; background:#ffeef5; }
  #panel .item span { font-size:9px; color:#888; margin-top:2px; }

  #actions {
    position:fixed; bottom:0; left:0; right:0; z-index:10;
    padding:9px 4px calc(9px + env(safe-area-inset-bottom));
    display:flex; gap:4px; justify-content:center;
    background:rgba(255,255,255,.7); backdrop-filter:blur(10px);
  }
  #actions button {
    flex:1; max-width:54px; padding:8px 0;
    border:none; border-radius:13px; font-size:9px; font-weight:600;
    background:#fff; color:#456; box-shadow:0 2px 8px rgba(0,0,0,.1);
    cursor:pointer; transition:transform .1s, background .2s;
    line-height:1.2;
  }
  #actions button:active { transform:scale(.93); background:#fff0f5; }
  #actions button .ico { display:block; font-size:15px; margin-bottom:1px; }
  #actions button.apologize { background:linear-gradient(135deg,#ffd6e0,#ffc0d4); color:#c04a7a; }

  .float {
    position:fixed; font-size:22px; pointer-events:none; z-index:99;
    animation: floatUp 1s ease-out forwards;
  }
  @keyframes floatUp {
    0%   { opacity:1; transform:translateY(0) scale(1); }
    100% { opacity:0; transform:translateY(-80px) scale(1.3); }
  }

  /* 飞行的球 / 物品 */
  .flying {
    position:fixed; font-size:38px; pointer-events:none; z-index:150;
  }

  #toast {
    position:fixed; top:46%; left:50%; transform:translate(-50%,-50%) scale(.7);
    color:#fff; padding:13px 24px; border-radius:18px;
    font-size:16px; font-weight:700; z-index:200;
    opacity:0; pointer-events:none; transition:all .4s;
    white-space:nowrap;
  }
  #toast.show { opacity:1; transform:translate(-50%,-50%) scale(1); }
  #toast.love  { background:linear-gradient(135deg,#ffb3c8,#ff8fb1); box-shadow:0 10px 30px rgba(255,143,177,.5); }
  #toast.angry { background:linear-gradient(135deg,#ff6b6b,#ff9f43); box-shadow:0 10px 30px rgba(255,107,107,.5); }
  #toast.calm  { background:linear-gradient(135deg,#8fd3f4,#84fab0); box-shadow:0 10px 30px rgba(143,211,244,.5); }
  #toast.sad   { background:linear-gradient(135deg,#7fa8d8,#a8c8f0); box-shadow:0 10px 30px rgba(127,168,216,.5); }
  #toast.gift  { background:linear-gradient(135deg,#ffd166,#ff9ec4); box-shadow:0 10px 30px rgba(255,209,102,.5); }
  #toast.temp  { background:linear-gradient(135deg,#a8d8ea,#c8e6ff); box-shadow:0 10px 30px rgba(168,216,234,.5); }

  .heart {
    position:fixed; font-size:18px; pointer-events:none; z-index:98;
    animation: heartFall 1.6s ease-out forwards;
  }
  @keyframes heartFall {
    0%   { opacity:1; transform:translateY(0) rotate(0deg); }
    100% { opacity:0; transform:translateY(120px) rotate(40deg); }
  }

  .giftFly {
    position:fixed; font-size:36px; pointer-events:none; z-index:120;
    animation: giftFly 2s ease-out forwards;
  }
  @keyframes giftFly {
    0%   { opacity:0; transform:translate(0,0) scale(.4); }
    30%  { opacity:1; transform:translate(0,-40px) scale(1.2); }
    100% { opacity:0; transform:translate(0,-140px) scale(.8); }
  }

  #giftBag {
    position:fixed; top:44px; right:8px; z-index:15;
    background:rgba(255,255,255,.85); backdrop-filter:blur(8px);
    border-radius:14px; padding:6px 10px; font-size:12px; color:#e0629a;
    box-shadow:0 2px 10px rgba(0,0,0,.1); font-weight:700; cursor:pointer;
  }

  /* 冷热效果 */
  #coldBreath {
    position:fixed; pointer-events:none; z-index:60;
    font-size:20px; opacity:0; transition:opacity .5s;
  }
  #coldBreath.show { opacity:.85; animation: breath 2s ease-in-out infinite; }
  @keyframes breath {
    0%,100% { transform:translateY(0) scale(1); opacity:.5; }
    50%     { transform:translateY(-6px) scale(1.15); opacity:.9; }
  }
  #sweat {
    position:fixed; pointer-events:none; z-index:60;
    font-size:18px; opacity:0; transition:opacity .5s;
  }
  #sweat.show { opacity:.9; animation: sweatDrop 1.6s ease-in infinite; }
  @keyframes sweatDrop {
    0%   { transform:translateY(0); opacity:0; }
    30%  { opacity:1; }
    100% { transform:translateY(24px); opacity:0; }
  }
</style>
</head>

function setClothes(key) {

}

/* ================= 温度 ================= */
function setTemp(t) {
  state.temp = t;
  document.body.classList.remove('cold','hot');
  if (t === 'cold') document.body.classList.add('cold');
  if (t === 'hot')  document.body.classList.add('hot');
  tempLabel.textContent = CONFIG.temp[t].label;

  // 冷热特效
  const r = petWrap.getBoundingClientRect();
  coldBreath.style.left = (r.left + r.width*0.7) + 'px';
  coldBreath.style.top  = (r.top + 60) + 'px';
  sweat.style.left = (r.left + r.width*0.75) + 'px';
  sweat.style.top  = (r.top + 50) + 'px';
  coldBreath.classList.toggle('show', t === 'cold');
  sweat.classList.toggle('show', t === 'hot');

  // 抖动 / 反应
  petWrap.classList.remove('shiver');
  if (t === 'cold') {
    petWrap.classList.add('shiver');
    say(rand(CONFIG.temp.cold.idle), 2500);
    setFace('sad');
  } else if (t === 'hot') {
    say(rand(CONFIG.temp.hot.idle), 2500);
    setFace('sad');
  } else {
    say('……嗯，舒服。', 2000);
    setFace('normal');
  }
  save();
}
function openTemp() {
  choices.classList.remove('show');
  const list = [
    ['cold',   { emo:'❄️', name:'冷' }],
    ['normal', { emo:'🌤️', name:'正常' }],
    ['hot',    { emo:'🔥', name:'热' }]
  ];
  buildPanel('🌡️ 调节温度', list, (k) => {
    setTemp(k);
    showToast(`🌡️ 温度：${CONFIG.temp[k].label}`, 'temp');
    closePanel();
  }, state.temp);
}

/* ================= 礼物 ================= */
function useItem(key) {
  const it = ITEMS[key]; if (!it) return;
  const isAngry = state.angry >= 30;
  const isSad   = state.sad >= 30;

  // 温度影响反应
  let face = it.face || 'shy';
  let lines = it.lines;
  if (state.temp === 'cold' && (key === 'milktea' || key === 'cake')) {
    lines = CONFIG.temp.cold.feed; face = 'happy';
  }
  if (state.temp === 'hot' && (key === 'milktea' || key === 'cake')) {
    lines = CONFIG.temp.hot.feed; face = 'sad';
  }

  propEl.innerHTML = it.prop;
  setTimeout(() => { propEl.innerHTML = ''; }, 2600);

  if (isAngry) {
    say(rand(['……哼。','……干嘛。','……这次就算了。']), 2800); setFace('shy');
  } else if (isSad) {
    say(rand(['……嗯。','……谢谢。','……好一点了。']), 2800); setFace('shy'); calmSad(20);
  } else {
    say(rand(lines), 2800); setFace(face);
  }

  state.mood = Math.min(100, state.mood + (it.mood || 0));
  state.food = Math.min(100, state.food + (it.food || 0));
  addLove(isAngry || isSad ? Math.ceil((it.love || 3) / 2) : (it.love || 3));
  calmDown(it.calm || 20);
  if (isSad) calmSad(it.calm || 20);
  update();

  if (state.currentRequest && state.currentRequest.want === key) {
    say('……就是这个。谢谢你。', 3000);
    addLove(8); showToast('💗 她很高兴！', 'love');
    state.currentRequest = null;
  }

  for (let i = 0; i < 6; i++) setTimeout(() => spawnHeart(), i * 100);
  closePanel();
}

function spawnHeart() {
  const h = document.createElement('div');
  h.className = 'heart';
  h.textContent = rand(['✨','💫','🌸','💛','⭐']);
  h.style.left = (20 + Math.random() * 60) + 'vw';
  h.style.top  = (35 + Math.random() * 20) + 'vh';
  document.body.appendChild(h);
  setTimeout(() => h.remove(), 1700);
}

/* ================= 好感 / 生气 / 伤心 ================= */
function getLevel() {
  let cur = LEVELS[0];
  for (const l of LEVELS) if (state.love >= l.min) cur = l;
  return cur;
}
function lovePercent() {
  const cur = getLevel(); const idx = LEVELS.indexOf(cur); const next = LEVELS[idx + 1];
  if (!next) return 100;
  return Math.min(100, ((state.love - cur.min) / (next.min - cur.min)) * 100);
}
function addLove(n) {
  const before = getLevel().lv;
  state.love = Math.max(0, state.love + n);
  const after = getLevel();
  if (after.lv > before) showToast(`💗 好感提升！${after.name}`, 'love');
}

function isAngry() { return state.angry >= 60; }
function isSad()   { return state.sad >= 50; }

function addAngry(n) {
  const was = isAngry();
  state.angry = Math.min(100, state.angry + n);
  if (!was && isAngry()) {
    showToast('😠 何芬生气了！', 'angry');
    setFace('angry');
    petWrap.classList.remove('shake'); void petWrap.offsetWidth; petWrap.classList.add('shake');
    say(rand(CONFIG.angry.lines), 2800);
  }
}
function calmDown(n) {
  if (n <= 0) return;
  const before = state.angry;
  state.angry = Math.max(0, state.angry - n);
  if (before >= 60 && state.angry < 60 && state.angry > 0) {
    showToast('😌 她没那么气了', 'calm'); setFace('shy'); say(rand(CONFIG.angry.soft), 2200);
  }
  if (before > 0 && state.angry === 0) { showToast('😊 她原谅你了', 'calm'); setFace('happy'); }
}
function addSad(n) {
  const was = isSad();
  state.sad = Math.min(100, state.sad + n);
  state.mood = Math.max(0, state.mood - n * 0.5);
  if (!was && isSad()) {
    showToast('💧 何芬伤心了…', 'sad');
    setFace('cry');
    say(rand(CONFIG.sad.lines), 3000);
    if (state.sad >= 70) scheduleLeave();
  }
}
function calmSad(n) {
  if (n <= 0) return;
  const before = state.sad;
  state.sad = Math.max(0, state.sad - n);
  if (before >= 50 && state.sad < 50 && state.sad > 0) showToast('💙 她好受一点了', 'calm');
  if (before > 0 && state.sad === 0) { showToast('😊 她不难过了', 'calm'); setFace('happy'); }
}

/* ================= 她走开 ================= */
let awayTimer = null;
function scheduleLeave() {
  if (state.away) return;
  setTimeout(() => {
    if (state.sad < 60) return;
    state.away = true;
    say(rand(CONFIG.sad.leave), 2200);
    setFace('cry');
    setTimeout(() => {
      petWrap.classList.add('away');
      awayTimer = setTimeout(() => {
        state.away = false;
        petWrap.classList.remove('away');
        state.sad = Math.max(0, state.sad - 25);
        update();
        say('……我回来了。', 2500);
        setFace('sad');
      }, 30000);
    }, 1200);
  }, 1500);
}

/* ================= 欺负（带实物动画） ================= */
function meanAction(m) {
  closePanel();

  // ★ 有投掷物：先飞出来，再打中
  if (m.throw) {
    const r = petWrap.getBoundingClientRect();
    const targetX = r.left + r.width / 2;
    const targetY = r.top + r.height * 0.35;
    // 从屏幕左下角飞出来
    const startX = 10;
    const startY = window.innerHeight - 80;

    const el = document.createElement('div');
    el.className = 'flying';
    el.textContent = m.throw;
    el.style.left = startX + 'px';
    el.style.top  = startY + 'px';
    el.style.transition = 'left .5s cubic-bezier(.3,.1,.6,1), top .5s cubic-bezier(.3,.1,.6,1), transform .5s';
    document.body.appendChild(el);

    requestAnimationFrame(() => {
      el.style.left = (targetX - 19) + 'px';
      el.style.top  = (targetY - 19) + 'px';
      el.style.transform = 'rotate(720deg) scale(1.2)';
    });

    // 命中
    setTimeout(() => {
      el.textContent = '💥';
      setTimeout(() => el.remove(), 400);

      // 命中后：抖动 + 表情
      petWrap.classList.remove('shake'); void petWrap.offsetWidth; petWrap.classList.add('shake');
      setFace(m.face || 'hit');
      say(rand(m.reply), 3000);

      // 实际结算
      addSad(m.sad);
      addAngry(m.sad * 0.3);
      addLove(-2);
      state.mood = Math.max(0, state.mood - 5);
      update();

      const rr = petWrap.getBoundingClientRect();
      floatText('💔', rr.left + rr.width/2, rr.top + 40);
    }, 520);

    return;
  }

  // 无投掷物：直接结算
  addSad(m.sad);
  addAngry(m.sad * 0.3);
  addLove(-2);
  state.mood = Math.max(0, state.mood - 5);
  update();
  say(rand(m.reply), 3000);
  setFace(m.face || 'sad');
  const r = petWrap.getBoundingClientRect();
  floatText('💔', r.left + r.width/2, r.top + 40);
}

/* ================= 存档 ================= */
function load() {
  const s = localStorage.getItem('hefenState');
  if (!s) return;
  try {
    const d = JSON.parse(s);
    const hours = (Date.now() - d.lastTime) / 3600000;
    state.mood = Math.max(0, d.mood - hours * 2);
    state.food = Math.max(0, d.food - hours * 4);
    state.love = d.love || 0;
    state.angry = Math.max(0, (d.angry || 0) - hours * 10);
    state.sad   = Math.max(0, (d.sad   || 0) - hours * 10);
    state.clothes = d.clothes || 'school';
    state.headwear = d.headwear || 'none';
    state.temp = d.temp || 'normal';
    state.bag = d.bag || [];
  } catch(e) {}
}
function save() {
  state.lastTime = Date.now();
  localStorage.setItem('hefenState', JSON.stringify({
    mood: state.mood, food: state.food,
    love: state.love, angry: state.angry, sad: state.sad,
    clothes: state.clothes, headwear: state.headwear,
    temp: state.temp, bag: state.bag,
    lastTime: state.lastTime
  }));
}
function render() {
  moodFill.style.width = state.mood + '%';
  foodFill.style.width = state.food + '%';
  loveFill.style.width = lovePercent() + '%';
  angryFill.style.width = state.angry + '%';
  sadFill.style.width = state.sad + '%';
  const lv = getLevel();
  loveLv.textContent = `Lv.${lv.lv}`;
  bagCount.textContent = state.bag.length;
  tempLabel.textContent = CONFIG.temp[state.temp].label;
  const btn = document.getElementById('apologyBtn');
  if (isAngry() || isSad()) btn.classList.add('apologize');
  else btn.classList.remove('apologize');
}
function update() {
  state.mood = Math.max(0, Math.min(100, state.mood));
  state.food = Math.max(0, Math.min(100, state.food));
  state.angry = Math.max(0, Math.min(100, state.angry));
  state.sad = Math.max(0, Math.min(100, state.sad));
  state.love = Math.max(0, state.love);
  render(); save();
}

/* ================= 气泡 ================= */
let bubbleTimer;
function say(text, ms = 2400) {
  bubble.textContent = text;
  bubble.classList.add('show');
  positionBubble();
  clearTimeout(bubbleTimer);
  bubbleTimer = setTimeout(() => bubble.classList.remove('show'), ms);
}
function positionBubble() {
  const r = petWrap.getBoundingClientRect();
  const bw = bubble.offsetWidth;
  let left = r.left + r.width / 2 - bw / 2;
  left = Math.max(8, Math.min(window.innerWidth - bw - 8, left));
  const top = r.top - bubble.offsetHeight - 14;
  bubble.style.left = left + 'px';
  bubble.style.top  = Math.max(48, top) + 'px';
}
window.addEventListener('resize', () => {
  if (bubble.classList.contains('show')) positionBubble();
  const r = petWrap.getBoundingClientRect();
  coldBreath.style.left = (r.left + r.width*0.7) + 'px';
  coldBreath.style.top  = (r.top + 60) + 'px';
  sweat.style.left = (r.left + r.width*0.75) + 'px';
  sweat.style.top  = (r.top + 50) + 'px';
});

function rand(arr) { return arr[Math.floor(Math.random() * arr.length)]; }
function pickLine(type) {
  // 温度优先
  if (state.temp === 'cold') return rand(CONFIG.temp.cold[type] || CONFIG.temp.cold.idle);
  if (state.temp === 'hot')  return rand(CONFIG.temp.hot[type]  || CONFIG.temp.hot.idle);
  if (type === 'idle' && state.love > 80 && state.mood > 70 && Math.random() < 0.5) {
    return rand(CONFIG.lines.warm);
  }
  return rand(CONFIG.lines[type]);
}
function floatText(txt, x, y) {
  const el = document.createElement('div');
  el.className = 'float';
  el.textContent = txt;
  el.style.left = (x - 14) + 'px';
  el.style.top  = (y - 20) + 'px';
  document.body.appendChild(el);
  setTimeout(() => el.remove(), 1000);
}
function showToast(text, type) {
  toastEl.textContent = text;
  toastEl.className = 'show ' + (type || '');
  setTimeout(() => toastEl.className = '', 1800);
}

/* ================= 点身体 ================= */
petWrap.addEventListener('click', (e) => {
  if (state.away) return;
  const rect = petWrap.getBoundingClientRect();
  const y = (e.clientY - rect.top) / rect.height;
  const x = (e.clientX - rect.left) / rect.width;

  if (isAngry()) {
    const now = Date.now();
    if (now - state.lastTap < 1200) { addAngry(4); say(rand(CONFIG.angry.overTap), 2000); }
    else { say(rand(CONFIG.angry.lines), 2000); }
    state.lastTap = now;
    setFace('angry');
    petWrap.classList.remove('shake'); void petWrap.offsetWidth; petWrap.classList.add('shake');
    return;
  }
  if (isSad()) {
    say(rand(CONFIG.sad.cry), 2200);
    setFace('cry'); calmSad(3); return;
  }

  petWrap.classList.remove('happy');
  void petWrap.offsetWidth;
  petWrap.classList.add('happy');

  const now = Date.now();
  if (now - state.lastTap < 700) state.tapCount++;
  else state.tapCount = 1;
  state.lastTap = now;

  let face = 'normal', line = 'tap', loveAdd = 1;

  if (y < 0.42) {
    if (x > 0.35 && x < 0.65 && y > 0.28) {
      face = 'angry'; line = 'faceTap'; loveAdd = 0;
      addAngry(5); floatText('💢', e.clientX, e.clientY);
    } else {
      face = 'shy'; line = 'head'; loveAdd = 2;
      floatText('🫶', e.clientX, e.clientY);
    }
  } else if (y > 0.75) {
    face = 'angry'; line = 'body'; loveAdd = 0;
    addAngry(4); floatText('💢', e.clientX, e.clientY);
  } else {
    face = state.mood > 60 && Math.random() < 0.5 ? 'happy' : 'shy';
    line = 'tap'; loveAdd = 1;
    floatText('💕', e.clientX, e.clientY);
  }

  if (state.tapCount >= 5) { addAngry(8); state.tapCount = 0; }

  state.mood = Math.min(100, state.mood + 2);
  addLove(loveAdd);
  update();
  say(pickLine(line));
  setFace(face);
});

/* ================= 聊天 ================= */
function chat() {
  closePanel();
  if (state.away) { say('……（她不在）', 2000); return; }
  if (isAngry()) {
    say(rand(['……现在不想说话。', '……哼。', '……干嘛。']), 2500);
    setFace('angry'); calmDown(6); update(); return;
  }
  if (isSad()) {
    say(rand(['……','……嗯。','……你说吧。']), 2500);
    setFace('sad'); calmSad(5); update(); return;
  }
  const lv = getLevel().lv;
  const available = TOPICS.filter(t => t.minLv <= lv);
  const pool = [...available].sort(() => Math.random() - 0.5).slice(0, 3);
  choices.innerHTML = '';
  pool.forEach(t => {
    const btn = document.createElement('button');
    btn.innerHTML = `<span class="emo">${t.emo}</span>${t.q}`;
    btn.onclick = () => askTopic(t);
    choices.appendChild(btn);
  });
  choices.classList.add('show');
  say('……你想问什么？', 3000);
  setFace('normal');
}
function askTopic(t) {
  choices.classList.remove('show');
  say(rand(t.a), 3200);
  setFace(t.face || 'normal');
  addLove(t.love || 2);
  state.mood = Math.min(100, state.mood + 2);
  calmDown(12); calmSad(12);
  update();
}

/* ================= 道歉 ================= */
function apologize() {
  closePanel(); choices.classList.remove('show');
  if (state.away) { say('……（她不在）', 2000); return; }
  const wasAngry = isAngry(); const wasSad = isSad();
  if (!wasAngry && !wasSad) {
    say(rand(['……干嘛道歉。', '我又没生气。', '……嗯，知道了。']), 2200);
    setFace('shy'); return;
  }
  if (wasAngry) calmDown(rand([25, 28, 30, 35]));
  if (wasSad)   calmSad(rand([25, 28, 30, 35]));
  addLove(2);
  state.mood = Math.min(100, state.mood + 5);
  update();
  if (isAngry() || isSad()) {
    say(rand(['……哼。', '……还没消气。', '……再哄哄。', '……嗯。']), 2200);
    setFace(wasSad ? 'sad' : 'angry');
  } else {
    say(rand(['……好吧。', '……原谅你了。', '……这次就算了。']), 2600);
    setFace('shy');
  }
  const r = petWrap.getBoundingClientRect();
  floatText('🙇', r.left + r.width/2, r.top);
}

/* ================= 她送礼物 / 提要求 / 撒娇 ================= */
function giveGiftToUser() {
  const keys = Object.keys(ITEMS);
  const k = rand(keys); const it = ITEMS[k];
  state.bag.push(k); save(); render();
  const r = petWrap.getBoundingClientRect();
  const g = document.createElement('div');
  g.className = 'giftFly'; g.textContent = it.emo;
  g.style.left = (r.left + r.width/2 - 18) + 'px';
  g.style.top  = (r.top + 20) + 'px';
  document.body.appendChild(g);
  setTimeout(() => g.remove(), 2000);
  showToast(`🎁 她送了你${it.name}！`, 'gift');
  say(rand(['……这个给你。', '……拿着吧。', '……看到就想到你了。', '……不是什么好东西。']), 3000);
  setFace('shy'); addLove(3); update();
}
function makeRequest() {
  const req = rand(CONFIG.requests);
  state.currentRequest = req;
  say(req.text, 3500); setFace('shy');
  showToast(`${req.emo} 她想要什么…`, 'love');
  const r = petWrap.getBoundingClientRect();
  floatText(req.emo, r.left + r.width/2, r.top + 30);
}
function coquetry() {
  petWrap.classList.add('lean');
  setTimeout(() => petWrap.classList.remove('lean'), 2400);
  say(rand(CONFIG.coquettish), 2800);
  setFace('shy');
}

/* ================= 定时 ================= */
setInterval(() => {
  state.mood = Math.max(0, state.mood - 0.5);
  state.food = Math.max(0, state.food - 1.0);
  if (state.angry > 0) state.angry = Math.max(0, state.angry - 1.5);
  if (state.sad > 0)   state.sad   = Math.max(0, state.sad   - 1.0);

  // 温度影响心情
  if (state.temp === 'cold' || state.temp === 'hot') {
    state.mood = Math.max(0, state.mood - 0.3);
  }
  update();

  if (Math.random() < 0.10 && !choices.classList.contains('show') && !panel.classList.contains('show') && !isAngry() && !isSad() && !state.away) {
    if (state.food < 25)      { say(pickLine('hungry')); setFace('sad'); }
    else if (state.mood < 25) { say(pickLine('sad'));    setFace('sad'); }
    else                      { say(pickLine('idle')); }
  }
  if (Math.random() < 0.08 && !state.away && !isAngry() && !isSad() && state.mood > 65 && state.love > 50) coquetry();
  if (Math.random() < 0.04 && !state.away && !isAngry() && !isSad() && state.mood > 60 && state.love > 80) giveGiftToUser();
  if (Math.random() < 0.06 && !state.away && !isAngry() && !isSad() && !state.currentRequest && state.love > 40) makeRequest();
  save();
}, 8000);

window.addEventListener('beforeunload', save);
document.addEventListener('visibilitychange', () => { if (document.hidden) save(); });

/* ================= 启动 ================= */
load();
setClothes(state.clothes);
setHeadwear(state.headwear);
setTemp(state.temp);
update();
setFace('normal');
setTimeout(() => say(`我是${CONFIG.name}。……你好。`), 700);
</script>
</body>
</html>
